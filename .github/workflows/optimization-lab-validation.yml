name: Optimization Lab validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'optimization/**'
      - '_includes/optimization/**'
      - '_layouts/optimization-lesson.html'
      - '_layouts/default.html'
      - 'assets/js/optimization/**'
      - 'assets/css/optimization-*.scss'
      - 'scripts/optimization/**'
      - '_config.yml'
      - '.github/workflows/optimization-lab-validation.yml'
  pull_request:
    paths:
      - 'optimization/**'
      - '_includes/optimization/**'
      - '_layouts/optimization-lesson.html'
      - '_layouts/default.html'
      - 'assets/js/optimization/**'
      - 'assets/css/optimization-*.scss'
      - 'scripts/optimization/**'
      - '_config.yml'
      - '.github/workflows/optimization-lab-validation.yml'

jobs:
  verify-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test verified mathematical engine and UI
        run: |
          node --test scripts/optimization/profit-model.test.cjs scripts/optimization/profit-ui.test.cjs

      - name: Verify OPT-001 Python teaching example
        run: python3 scripts/optimization/opt001_example.py

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Verify generated pages and assets
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/optimization/index.html
          test -f _site/optimization/labs/profit-preview/index.html
          test -f _site/optimization/learn/template-preview/index.html
          test -f _site/assets/css/optimization-profit.css
          test -f _site/assets/css/optimization-lesson.css
          test -f _site/assets/js/optimization/profit-model.js
          test -f _site/assets/js/optimization/profit-ui.js
          grep -q 'noindex,nofollow' _site/optimization/labs/profit-preview/index.html
          test -f _site/optimization/learn/foundations/what-is-optimization/index.html
          grep -q 'name="robots" content="noindex,nofollow"' _site/optimization/learn/foundations/what-is-optimization/index.html
          grep -q 'ol-profit-lab' _site/optimization/learn/foundations/what-is-optimization/index.html
          grep -q 'Optimization Lab' _site/optimization/index.html
          ! test -d _site/docs/project-management
          echo "Optimization Lab build smoke checks passed"

      - name: Install Chromium browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local Jekyll test server
        shell: bash
        run: |
          nohup python3 -m http.server 8765 --directory _site >/tmp/optimization-lab-http.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/optimization/ >/dev/null

      - name: Browser-test LAB-A simulator
        shell: bash
        run: |
          set -o pipefail
          node scripts/optimization/profit-browser.test.cjs 2>&1 | tee /tmp/optimization-lab-a-browser.log

      - name: Browser-test OPT-001 lesson
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          node scripts/optimization/opt001-browser.test.cjs 2>&1 | tee /tmp/optimization-opt001-browser.log

      - name: Stop local Jekyll test server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload small browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-browser-diagnostics
          path: |
            /tmp/optimization-lab-a-browser.log
            /tmp/optimization-opt001-browser.log
            _site/optimization/labs/profit-preview/index.html
            _site/optimization/learn/foundations/what-is-optimization/index.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-lab-jekyll-site
          path: _site/
          if-no-files-found: ignore
          retention-days: 7
